<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>El Mapa de tu Resistencia</title>
<meta name="description" content="Un test de cuatro minutos para descubrir en qué punto exacto se te para eso que quieres hacer." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --text: #0B0F17;
    --muted: #4A5468;
    --accent: #5B8CFF;
    --accent-dark: #3F6FE0;
    --border: #E4E4E0;
    --max: 680px;
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .serif {
    font-family: "Literata", Georgia, "Times New Roman", serif;
  }

  h1, h2, h3 { font-family: "Literata", Georgia, serif; line-height: 1.25; margin: 0 0 18px; font-weight: 600; }

  p { margin: 0 0 16px; }

  a { color: var(--accent-dark); }

  button { font-family: inherit; }

  /* Layout */
  #app {
    max-width: var(--max);
    margin: 0 auto;
    padding: 32px 20px 80px;
    min-height: 100vh;
  }

  .screen {
    animation: fadeIn 0.35s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .screen { animation: none; }
    * { transition: none !important; }
  }

  /* Progress bar */
  .progress-wrap {
    position: sticky;
    top: 0;
    background: var(--bg);
    padding: 14px 0 10px;
    margin: -32px 0 24px;
    z-index: 5;
  }
  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 8px;
    text-align: right;
  }

  /* Intro */
  .kicker {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-dark);
    margin-bottom: 18px;
  }
  .intro h1 {
    font-size: clamp(1.7rem, 5vw, 2.3rem);
  }
  .intro .subtitle {
    font-size: 1.05rem;
    color: var(--muted);
    font-family: "Literata", Georgia, serif;
    font-style: italic;
    margin-bottom: 26px;
  }
  .intro .lead p {
    font-size: 1.05rem;
    font-family: "Literata", Georgia, serif;
  }

  /* Question */
  .question-block { margin-bottom: 8px; }
  .question-text {
    font-size: clamp(1.25rem, 4.2vw, 1.6rem);
    margin-bottom: 8px;
  }
  .question-help {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 22px;
    font-style: italic;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }

  .option-btn {
    text-align: left;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    font-size: 1rem;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
  }
  .option-btn:hover, .option-btn:focus-visible {
    border-color: var(--accent);
    background: #F3F6FF;
    outline: none;
  }
  .option-btn.selected {
    border-color: var(--accent);
    background: #EEF3FF;
  }
  .option-key {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
  }

  input[type="text"], input[type="email"], textarea {
    width: 100%;
    font-family: "Literata", Georgia, serif;
    font-size: 1.1rem;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    margin-top: 8px;
  }
  input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.95rem; }

  .field { margin-bottom: 22px; }
  .error-text {
    color: #C23636;
    font-size: 0.85rem;
    margin-top: 6px;
    display: none;
  }
  .field.invalid .error-text { display: block; }
  .field.invalid input { border-color: #C23636; }

  .btn-primary {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px 30px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s ease;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-row { margin-top: 26px; }

  fieldset { border: none; padding: 0; margin: 0; }
  legend { padding: 0; }

  /* Result screen */
  .result-kicker {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .giro {
    font-family: "Literata", Georgia, serif;
    font-size: 1.15rem;
    padding-bottom: 20px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .profile-name {
    font-size: clamp(1.7rem, 6vw, 2.4rem);
    margin-bottom: 22px;
  }
  .result-section {
    margin: 34px 0;
  }
  .result-section h3 {
    font-size: 1.05rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent-dark);
    font-family: "Inter", sans-serif;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .result-section p, .forma-block p {
    font-family: "Literata", Georgia, serif;
    font-size: 1.05rem;
  }
  .forma-block {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin: 34px 0;
  }
  .forma-block h3 {
    font-size: 0.9rem;
    color: var(--muted);
    font-family: "Inter", sans-serif;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
    margin-bottom: 10px;
  }
  blockquote {
    margin: 16px 0;
    padding: 4px 0 4px 18px;
    border-left: 3px solid var(--accent);
    font-family: "Literata", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--text);
  }
  .email-notice {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.95rem;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  #debug-panel {
    max-width: var(--max);
    margin: 0 auto;
    padding: 20px;
    font-family: monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    background: #111;
    color: #0f0;
  }
</style>
</head>

<div id="app"></div>

const state = {
  step: 'intro', // 'intro' | qIndex (number) | 'email' | 'result'
  qIndex: 0,
  answers: {},          // field -> valor
  zA: 0, zB: 0, zC: 0,
  iA: 0, iB: 0, iC: 0,
  forma: null,
  nombre: '',
  email: ''
};

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function fillTemplate(tpl) {
  return tpl.replace(/\{eso\}/g, escapeHtml(state.answers.eso || 'eso'));
}

function fillCopy(tpl) {
  return tpl.replace(/\{tiempo\}/g, escapeHtml(state.answers.tiempo || 'un tiempo'));
}

/* =====================================================================
   LÓGICA DE PUNTUACIÓN — exacta según el documento
   ===================================================================== */
function resolveZona(zA, zB, zC) {
  if (zC >= zA && zC >= zB) return 'nosale';
  if (zB >= zA) return 'notermina';
  return 'noarranca';
}

function resolveInstinto(iA, iB, iC) {
  if (iC >= iA && iC >= iB) return 'sexual';
  if (iB >= iA) return 'social';
  return 'conservacion';
}

function computePerfil() {
  const zona = resolveZona(state.zA, state.zB, state.zC);
  const instinto = resolveInstinto(state.iA, state.iB, state.iC);
  return { zona, instinto, perfil: zona + '_' + instinto };
}

/* =====================================================================
   TESTS — modo debug con ?debug=1
   ===================================================================== */
function runTests() {
  const cases = [
    // [zA, zB, zC, esperado]
    { fn: 'zona', args: [0, 0, 0], expected: 'nosale' },          // empate total -> gana la más avanzada
    { fn: 'zona', args: [3, 0, 0], expected: 'noarranca' },
    { fn: 'zona', args: [1, 3, 0], expected: 'notermina' },
    { fn: 'zona', args: [1, 1, 3], expected: 'nosale' },
    { fn: 'zona', args: [2, 2, 0], expected: 'notermina' },       // empate zA/zB -> gana zB
    { fn: 'zona', args: [2, 0, 2], expected: 'nosale' },          // empate zA/zC -> gana zC
    { fn: 'zona', args: [0, 2, 2], expected: 'nosale' },          // empate zB/zC -> gana zC
    { fn: 'zona', args: [4, 0, 0], expected: 'noarranca' },
    { fn: 'instinto', args: [0, 0, 0], expected: 'sexual' },
    { fn: 'instinto', args: [8, 0, 0], expected: 'conservacion' },
    { fn: 'instinto', args: [0, 8, 0], expected: 'social' },
    { fn: 'instinto', args: [0, 0, 8], expected: 'sexual' },
    { fn: 'instinto', args: [4, 4, 0], expected: 'social' },      // empate iA/iB -> gana iB
    { fn: 'instinto', args: [4, 0, 4], expected: 'sexual' },      // empate iA/iC -> gana iC
    { fn: 'instinto', args: [0, 4, 4], expected: 'sexual' },      // empate iB/iC -> gana iC
    { fn: 'instinto', args: [3, 3, 3], expected: 'sexual' }       // triple empate -> gana iC
  ];

  const profileKeys = Object.keys(PROFILES);
  const expectedKeys = [
    'noarranca_conservacion', 'noarranca_social', 'noarranca_sexual',
    'notermina_conservacion', 'notermina_social', 'notermina_sexual',
    'nosale_conservacion', 'nosale_social', 'nosale_sexual'
  ];

  let out = [];
  let pass = 0, fail = 0;

  cases.forEach((c, i) => {
    const got = c.fn === 'zona' ? resolveZona(...c.args) : resolveInstinto(...c.args);
    const ok = got === c.expected;
    ok ? pass++ : fail++;
    out.push((ok ? 'PASS' : 'FAIL') + '  ' + c.fn + '(' + c.args.join(',') + ') = ' + got + '  (esperado: ' + c.expected + ')');
  });

  const missing = expectedKeys.filter(k => !profileKeys.includes(k));
  const extra = profileKeys.filter(k => !expectedKeys.includes(k));
  if (missing.length === 0 && extra.length === 0 && profileKeys.length === 9) {
    pass++; out.push('PASS  Los 9 perfiles existen y coinciden con zona_instinto');
  } else {
    fail++; out.push('FAIL  Perfiles: faltan=' + JSON.stringify(missing) + ' sobran=' + JSON.stringify(extra));
  }

  out.push('');
  out.push('TOTAL: ' + pass + ' OK / ' + fail + ' FALLOS');
  return out.join('\n');
}

if (new URLSearchParams(location.search).get('debug') === '1') {
  const panel = document.getElementById('debug-panel');
  panel.hidden = false;
  panel.textContent = runTests();
}

const PENDING_KEY = 'resistencia_pending_submit';

function buildPayload() {
  const { zona, instinto, perfil } = computePerfil();
  return {
    nombre: state.nombre,
    email: state.email,
    eso: state.answers.eso || '',
    tiempo: state.answers.tiempo || '',
    frase: state.answers.frase || '',
    ultima: state.answers.ultima || '',
    sentido: state.answers.sentido || '',
    dolor: state.answers.dolor || '',
    forma: state.forma || '',
    zona, instinto, perfil,
    zA: state.zA, zB: state.zB, zC: state.zC,
    iA: state.iA, iB: state.iB, iC: state.iC
  };
}

function postPayload(bodyString) {
  return fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: bodyString
  });
}

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}

async function sendResult(payload) {
  const bodyString = JSON.stringify(payload);
  try {
    await withTimeout(postPayload(bodyString), 6000);
    localStorage.removeItem(PENDING_KEY);
  } catch (err) {
    try { localStorage.setItem(PENDING_KEY, bodyString); } catch (e) {}
    // Un reintento, en segundo plano, sin bloquear la pantalla de resultado
    setTimeout(() => {
      postPayload(bodyString).then(() => {
        try { localStorage.removeItem(PENDING_KEY); } catch (e) {}
      }).catch(() => {});
    }, 1500);
  }
}

function flushPendingIfAny() {
  let pending;
  try { pending = localStorage.getItem(PENDING_KEY); } catch (e) { return; }
  if (!pending) return;
  postPayload(pending).then(() => {
    try { localStorage.removeItem(PENDING_KEY); } catch (e) {}
  }).catch(() => {});
}
flushPendingIfAny();

const app = document.getElementById('app');

function render() {
  if (state.step === 'intro') return renderIntro();
  if (state.step === 'email') return renderEmailStep();
  if (state.step === 'result') return renderResult();
  return renderQuestion(state.step);
}

function progressBarHtml(current, total) {
  const pct = Math.round((current / total) * 100);
  return '' +
    '<div class="progress-wrap">' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-label">Pregunta ' + current + ' de ' + total + '</div>' +
    '</div>';
}

function renderIntro() {
  app.innerHTML = '' +
    '<div class="screen intro">' +
      '<span class="kicker">' + escapeHtml(INTRO.kicker) + '</span>' +
      '<h1>' + escapeHtml(INTRO.titular) + '</h1>' +
      '<p class="subtitle">' + escapeHtml(INTRO.subtitulo) + '</p>' +
      '<div class="lead">' + INTRO.parrafos.map(p => '<p>' + escapeHtml(p) + '</p>').join('') + '</div>' +
      '<button class="btn-primary" id="btn-empezar">Empezar</button>' +
    '</div>';
  document.getElementById('btn-empezar').addEventListener('click', () => {
    state.step = 0;
    render();
  });
}

function goToNextQuestion() {
  if (state.qIndex + 1 < QUESTIONS.length) {
    state.qIndex += 1;
    state.step = state.qIndex;
  } else {
    state.step = 'email';
  }
  render();
  const main = document.querySelector('.screen');
  if (main) main.scrollIntoView({ block: 'start' });
}

function applyScore(q, key) {
  if (!q.score) return;
  if (q.score.type === 'zona') state['z' + key] += 1;
  if (q.score.type === 'forma') state.forma = key;
  if (q.score.type === 'instinto') state['i' + key] += q.score.weight;
}

function renderQuestion(qIdx) {
  const q = QUESTIONS[qIdx];
  state.qIndex = qIdx;
  const total = QUESTIONS.length;
  const questionText = q.template ? fillTemplate(q.template) : (q.label ? fillTemplate(q.label) : '');

  let bodyHtml = '';

  if (q.type === 'choice') {
    bodyHtml = '<div class="options" role="group" aria-label="Opciones de respuesta">' +
      q.options.map(opt => (
        '<button class="option-btn" data-key="' + opt.key + '">' +
          '<span class="option-key">' + opt.key + '</span>' +
          '<span>' + escapeHtml(opt.label) + '</span>' +
        '</button>'
      )).join('') +
      '</div>';
  } else if (q.type === 'choiceList') {
    bodyHtml = '<div class="options" role="group" aria-label="Opciones de respuesta">' +
      q.options.map((opt, i) => (
        '<button class="option-btn" data-value="' + escapeHtml(opt) + '">' +
          '<span>' + escapeHtml(opt) + '</span>' +
        '</button>'
      )).join('') +
      '</div>';
  } else if (q.type === 'choiceOther') {
    bodyHtml = '<div class="options" role="group" aria-label="Opciones de respuesta">' +
      q.options.map(opt => (
        '<button class="option-btn" data-value="' + escapeHtml(opt) + '">' +
          '<span>' + escapeHtml(opt) + '</span>' +
        '</button>'
      )).join('') +
      '<button class="option-btn" id="opt-other" data-value="__other__">' +
        '<span>' + escapeHtml(q.otherLabel) + '…</span>' +
      '</button>' +
      '</div>' +
      '<div class="field" id="other-field" style="display:none; margin-top:16px;">' +
        '<label for="other-input" class="visually-hidden">Escribe tu respuesta</label>' +
        '<input type="text" id="other-input" placeholder="Escribe aquí…" />' +
        '<div class="btn-row"><button class="btn-primary" id="btn-other-next">Siguiente</button></div>' +
      '</div>';
  } else if (q.type === 'text') {
    bodyHtml = '' +
      '<div class="field" id="text-field">' +
        '<label for="text-input" class="visually-hidden">' + escapeHtml(questionText) + '</label>' +
        '<input type="text" id="text-input" autocomplete="off" />' +
        '<div class="error-text">Este campo es obligatorio.</div>' +
      '</div>' +
      '<div class="btn-row"><button class="btn-primary" id="btn-text-next">Siguiente</button></div>';
  }

  app.innerHTML = '' +
    progressBarHtml(qIdx + 1, total) +
    '<div class="screen">' +
      '<div class="question-block">' +
        '<div class="question-text serif">' + questionText + '</div>' +
        (q.help ? '<div class="question-help">' + escapeHtml(q.help) + '</div>' : '') +
      '</div>' +
      bodyHtml +
    '</div>';

  if (q.type === 'choice') {
    app.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-key');
        applyScore(q, key);
        if (q.field) state.answers[q.field] = key;
        goToNextQuestion();
      });
    });
  } else if (q.type === 'choiceList') {
    app.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.answers[q.field] = btn.getAttribute('data-value');
        goToNextQuestion();
      });
    });
  } else if (q.type === 'choiceOther') {
    const otherField = document.getElementById('other-field');
    const otherInput = document.getElementById('other-input');
    app.querySelectorAll('.option-btn[data-value]').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-value');
        if (val === '__other__') {
          otherField.style.display = 'block';
          otherInput.focus();
          return;
        }
        state.answers[q.field] = val;
        goToNextQuestion();
      });
    });
    document.getElementById('btn-other-next').addEventListener('click', () => {
      state.answers[q.field] = otherInput.value.trim();
      goToNextQuestion();
    });
    otherInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btn-other-next').click(); }
    });
  } else if (q.type === 'text') {
    const input = document.getElementById('text-input');
    const field = document.getElementById('text-field');
    const btn = document.getElementById('btn-text-next');
    input.focus();
    const commit = () => {
      const val = input.value.trim();
      if (q.required && !val) {
        field.classList.add('invalid');
        input.focus();
        return;
      }
      field.classList.remove('invalid');
      state.answers[q.field] = val;
      goToNextQuestion();
    };
    btn.addEventListener('click', commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
    });
  }
}

function isValidEmail(value) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
}

function renderEmailStep() {
  app.innerHTML = '' +
    '<div class="screen">' +
      '<h1 class="serif" style="font-size:1.5rem;">' + escapeHtml(EMAIL_STEP.intro) + '</h1>' +
      '<div class="field" id="field-nombre">' +
        '<label for="input-nombre">Nombre</label>' +
        '<input type="text" id="input-nombre" autocomplete="given-name" />' +
        '<div class="error-text">Escribe tu nombre.</div>' +
      '</div>' +
      '<div class="field" id="field-email">' +
        '<label for="input-email">Email</label>' +
        '<input type="email" id="input-email" autocomplete="email" inputmode="email" />' +
        '<div class="error-text">Escribe un email válido.</div>' +
      '</div>' +
      '<button class="btn-primary" id="btn-ver-mapa">Ver mi mapa</button>' +
    '</div>';

  const nombreField = document.getElementById('field-nombre');
  const emailField = document.getElementById('field-email');
  const nombreInput = document.getElementById('input-nombre');
  const emailInput = document.getElementById('input-email');
  const btn = document.getElementById('btn-ver-mapa');

  nombreInput.focus();

  async function submit() {
    const nombre = nombreInput.value.trim();
    const email = emailInput.value.trim();
    let valid = true;

    if (!nombre) { nombreField.classList.add('invalid'); valid = false; }
    else nombreField.classList.remove('invalid');

    if (!isValidEmail(email)) { emailField.classList.add('invalid'); valid = false; }
    else emailField.classList.remove('invalid');

    if (!valid) return;

    state.nombre = nombre;
    state.email = email;

    btn.disabled = true;
    btn.textContent = 'Preparando tu mapa…';

    const payload = buildPayload();
    await sendResult(payload);

    state.step = 'result';
    render();
  }

  btn.addEventListener('click', submit);
  emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
}

function renderResult() {
  const { perfil } = computePerfil();
  const profile = PROFILES[perfil];
  const tiempo = state.answers.tiempo || 'un tiempo';
  const eso = state.answers.eso || 'eso';
  const forma = state.forma;
  const dolor = state.answers.dolor || '';

  const giro = giroParrafos(tiempo).map(p => '<p>' + fillCopy(p) + '</p>').join('');
  const reconocimiento = profile.reconocimiento.map(p => '<p>' + escapeHtml(fillCopy(p)) + '</p>').join('');
  const noProblema = profile.noProblema.map(p => '<p>' + escapeHtml(fillCopy(p)) + '</p>').join('');
  const gesto = profile.gesto.map(p => '<p>' + escapeHtml(fillCopy(p)) + '</p>').join('');
  const cierre = CIERRE_COMUN.map(p => '<p>' + p + '</p>').join('');

  app.innerHTML = '' +
    '<div class="screen">' +
      '<div class="giro serif">' + giro + '</div>' +
      '<div class="result-kicker">Tu mapa</div>' +
      '<h1 class="profile-name">' + escapeHtml(profile.nombre) + '</h1>' +
      '<div class="result-section">' + reconocimiento + '</div>' +

      '<div class="forma-block">' +
        '<h3>Sobre cómo te paras tú, en concreto</h3>' +
        '<p>' + escapeHtml(FORMA_TEXTS[forma] || '') + '</p>' +
      '</div>' +

      '<div class="result-section">' +
        '<h3>Lo que NO es tu problema</h3>' +
        noProblema +
      '</div>' +

      '<div class="result-section">' +
        '<h3>Tu gesto · 72 horas</h3>' +
        gesto +
      '</div>' +

      '<div class="result-section">' +
        cierre +
        (dolor ? (
          '<p>Dijiste que, si «' + escapeHtml(eso) + '» sigue exactamente igual dentro de un año, lo que más te va a doler es esto:</p>' +
          '<blockquote>' + escapeHtml(dolor) + '</blockquote>'
        ) : '') +
      '</div>' +

      '<div class="email-notice">Te acabamos de enviar este mapa también a tu email' + (state.email ? (', <strong>' + escapeHtml(state.email) + '</strong>,') : '') + ' para que lo tengas siempre a mano.</div>' +
    '</div>';
}

render();
</script>
